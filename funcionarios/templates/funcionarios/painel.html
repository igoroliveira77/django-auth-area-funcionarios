{% extends 'base.html' %}

{% block conteudo %}
    <h1>Painel do Funcionário</h1>

    <p>Bem-vindo, {{ user.username }}!</p>

    <p>Você está autenticado no sistema.</p>

    <a href="{% url 'perfil_funcionario' %}">
        Meu perfil
    </a>

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Sair</button>
    </form>
{% endblock %}
