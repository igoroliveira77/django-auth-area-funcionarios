{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Restrita de Funcionários</title>
    <link rel="stylesheet" href="{% static 'funcionarios/css/estilo.css' %}">
</head>
<body>
    <div class="container">
        <nav>
            <a href="{% url 'home' %}">Início</a>

            {% if user.is_authenticated %}
                <a href="{% url 'painel_funcionarios' %}">Painel</a>
                <a href="{% url 'perfil_funcionario' %}">Meu perfil</a>
            {% else %}
                <a href="{% url 'login' %}">Entrar</a>
            {% endif %}
        </nav>

        <hr>

        {% block conteudo %}{% endblock %}
    </div>
</body>
</html>
